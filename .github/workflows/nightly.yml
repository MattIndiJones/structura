name: Suite complète nocturne

# The pull-request workflow (ci.yml) runs only the tests of changed files and
# their direct consumers. That selection let two broken screens reach main in
# November 2026 (Product Optimizer, UAT generator). This workflow runs every
# backend and frontend test, unattended, so a regression is seen the next
# morning rather than a month later. It does not change the local rule:
# targeted tests during development, full suite only on request.

on:
  schedule:
    # 01:30 UTC, Monday to Friday — main only (scheduled runs use the default branch).
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      # Every package pinned with the hash of each published file (P1-8, S12).
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python backend/scripts/check_environment.py
      - name: Suite backend complète (parallèle, un processus par cœur)
        run: python -m pytest backend/tests -q -n auto --dist load -rfE --junitxml=backend-tests.xml
        env:
          PYTHONPATH: .
          STRUCTURA_DISABLE_SCHEDULER: '1'
          STRUCTURA_DISABLE_RFQ_TRANSPORT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests
          path: backend-tests.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:skip-tests

  # End-to-end journeys (P1-10, U4/U5): the built interface, served by the real
  # backend on a throwaway data directory, driven by a real browser — login,
  # every screen, pricing through the queue, booking, risk, RFQ, and the global
  # error screen. Windows, like the backend job: DPAPI seals the throwaway
  # instance's secrets as it does on the desk.
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m playwright install chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface construite
        working-directory: frontend
        run: |
          npm ci
          npm run build:skip-tests
      - name: Parcours de bout en bout
        run: python -m pytest e2e -q -rfE --basetemp="${{ runner.temp }}\e2e" --junitxml=e2e-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-tests
          # The junit report, and the throwaway instance's own logs when a journey fails.
          path: |
            e2e-tests.xml
            ${{ runner.temp }}\e2e\**\server.log
            ${{ runner.temp }}\e2e\**\logs\structura.log

  # Known vulnerabilities in the locked dependencies (P1-8, S12). Nightly, not
  # on each pull request: an advisory published overnight must not block an
  # unrelated change, but it must be seen the next morning.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.9.0
      - name: Paquets Python verrouillés
        # The lock pins every package: audit it as written, without resolving.
        run: pip-audit --strict --disable-pip --require-hashes -r requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Paquets npm
        working-directory: frontend
        run: npm audit --audit-level=high
